name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # a throwaway postgres just for this run, so the database tests run here too
    # instead of being skipped
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_USER: casestudy
          POSTGRES_PASSWORD: casestudy
          POSTGRES_DB: casestudy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U casestudy"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://casestudy:casestudy@localhost:5432/casestudy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run typecheck
      # runs every test and fails if coverage drops under the thresholds in vitest.config.mts
      - run: npm run test:coverage
      # the html report is downloadable from the run page under artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage
      - run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build # typechecks first

  # starts the full demo exactly like `npm run demo` and checks the frontend
  # can reach the backend. if this fails, the demo is broken.
  integration:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm ci --prefix backend && npm ci --prefix frontend
      - run: npm run demo &
      - run: npm run smoke:demo
